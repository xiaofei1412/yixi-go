<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="335" viewBox="0 0 1200 335" role="img"><title>Separate product and model-training tracks</title><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="335" rx="20" fill="#f8f5ef" stroke="none"/><text x="35" y="42" font-size="25" fill="#193a32" font-weight="600">One Go foundation. Two engineering tracks.</text><text x="35" y="114" font-size="21" fill="#24745b" font-weight="600">Product</text><text x="35" y="236" font-size="21" fill="#bd8d4e" font-weight="600">Training</text><rect x="165" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="185" y="106" font-size="23" fill="#193a32" font-weight="600">Browser</text><text x="185" y="134" font-size="17" fill="#596f61" font-weight="400">Play / review / study</text><text x="481" y="122" font-size="24" fill="#24745b" font-weight="400">→</text><rect x="505" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="525" y="106" font-size="23" fill="#193a32" font-weight="600">FastAPI + SQLite</text><text x="525" y="134" font-size="17" fill="#596f61" font-weight="400">Games / practice / cache</text><text x="821" y="122" font-size="24" fill="#24745b" font-weight="400">→</text><rect x="845" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="865" y="106" font-size="23" fill="#193a32" font-weight="600">KataGo</text><text x="865" y="134" font-size="17" fill="#596f61" font-weight="400">Local analysis engine</text><rect x="165" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="185" y="228" font-size="22" fill="#193a32" font-weight="600">Teacher data</text><text x="185" y="256" font-size="17" fill="#776849" font-weight="400">200 games / 14,308 states</text><text x="481" y="242" font-size="24" fill="#bd8d4e" font-weight="400">→</text><rect x="505" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="525" y="228" font-size="22" fill="#193a32" font-weight="600">Distillation → PPO</text><text x="525" y="256" font-size="17" fill="#776849" font-weight="400">320K parameters / 6 configs</text><text x="821" y="242" font-size="24" fill="#bd8d4e" font-weight="400">→</text><rect x="845" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="865" y="228" font-size="22" fill="#193a32" font-weight="600">Evaluate &amp; select</text><text x="865" y="256" font-size="17" fill="#776849" font-weight="400">1,200 + 400 evaluation games</text><path d="M1015 158 V173 H320 V192" fill="none" stroke="#7b8e7a" stroke-width="1.5" stroke-dasharray="4 5"/><text x="35" y="314" font-size="17" fill="#69786f" font-weight="400">Shared rules, SGF and engine I/O. The student model is experimental; the app uses KataGo.</text></g></svg>
