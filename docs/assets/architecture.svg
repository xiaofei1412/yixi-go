<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="335" viewBox="0 0 1200 335" role="img"><title>产品服务与模型训练的双路线架构</title><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="1200" height="335" rx="20" fill="#f8f5ef" stroke="none"/><text x="35" y="42" font-size="25" fill="#193a32" font-weight="600">同一个围棋基础，两条实践路线</text><text x="35" y="114" font-size="21" fill="#24745b" font-weight="600">产品路线</text><text x="35" y="236" font-size="21" fill="#bd8d4e" font-weight="600">训练路线</text><rect x="165" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="185" y="106" font-size="23" fill="#193a32" font-weight="600">浏览器</text><text x="185" y="134" font-size="17" fill="#596f61" font-weight="400">对弈 · 复盘 · 学习中心</text><text x="481" y="122" font-size="24" fill="#24745b" font-weight="400">→</text><rect x="505" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="525" y="106" font-size="23" fill="#193a32" font-weight="600">FastAPI + SQLite</text><text x="525" y="134" font-size="17" fill="#596f61" font-weight="400">棋谱 · 练习 · 缓存</text><text x="821" y="122" font-size="24" fill="#24745b" font-weight="400">→</text><rect x="845" y="74" width="310" height="82" rx="14" fill="#e5eee7" stroke="none"/><text x="865" y="106" font-size="23" fill="#193a32" font-weight="600">KataGo</text><text x="865" y="134" font-size="17" fill="#596f61" font-weight="400">本地分析引擎</text><rect x="165" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="185" y="228" font-size="22" fill="#193a32" font-weight="600">教师数据</text><text x="185" y="256" font-size="17" fill="#776849" font-weight="400">200 局 / 14,308 状态</text><text x="481" y="242" font-size="24" fill="#bd8d4e" font-weight="400">→</text><rect x="505" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="525" y="228" font-size="22" fill="#193a32" font-weight="600">多任务蒸馏 → PPO</text><text x="525" y="256" font-size="17" fill="#776849" font-weight="400">32 万参数 / 六组对照</text><text x="821" y="242" font-size="24" fill="#bd8d4e" font-weight="400">→</text><rect x="845" y="196" width="310" height="82" rx="14" fill="#efe6d6" stroke="none"/><text x="865" y="228" font-size="22" fill="#193a32" font-weight="600">验证与模型选择</text><text x="865" y="256" font-size="17" fill="#776849" font-weight="400">1,200 局比较 + 400 局复核</text><path d="M1015 158 V173 H320 V192" fill="none" stroke="#7b8e7a" stroke-width="1.5" stroke-dasharray="4 5"/><text x="35" y="314" font-size="17" fill="#69786f" font-weight="400">共享规则与 SGF、引擎通信。学生模型用于实验；产品持续使用 KataGo。</text></g></svg>
